name: nour_al_islam
description: "🌙 Nour al-Islam – Application mobile musulmane gratuite & open source pour transformer les tentations numériques en actions spirituelles bénéfiques."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Backend & Auth
  supabase_flutter: ^2.5.0

  # UI Components
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  # firebase_core: ^2.24.0
  # firebase_messaging: ^14.7.0

  # Storage & Files
  path_provider: ^2.1.0

  # Utilities
  shared_preferences: ^2.2.2
  logger: ^2.0.0
  go_router: ^14.0.0
  share_plus: ^10.0.0
  fl_chart: ^0.69.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
