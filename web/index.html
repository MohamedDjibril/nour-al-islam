<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <meta name="description" content="🌙 Nour al-Islam – Application mobile musulmane gratuite et open source pour transformer les tentations numériques en actions spirituelles bénéfiques.">
  <meta name="author" content="momokeith131-boop">
  <meta name="keywords" content="islam, musulman, coran, dua, adhkar, hadith, prière, dhikr, application islamique, open source">
  <meta name="theme-color" content="#C9A84C">

  <meta property="og:title" content="Nour al-Islam">
  <meta property="og:description" content="La lumière qui guide votre retour vers Allah">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-192.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nour al-Islam">
  <meta name="twitter:description" content="La lumière qui guide votre retour vers Allah">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nour al-Islam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Nour al-Islam</title>

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" style="
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #FFF8E7 0%, #F5E6A3 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    z-index: 9999;
  ">
    <div style="
      font-size: 80px;
      line-height: 1;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    ">🌙</div>
    <div style="
      font-size: 28px;
      font-weight: 700;
      color: #C9A84C;
      margin-bottom: 8px;
      letter-spacing: 1px;
    ">Nour al-Islam</div>
    <div style="
      font-size: 18px;
      color: #C9A84C;
      opacity: 0.7;
      font-family: 'Amiri', serif;
    ">نور الإسلام</div>
    <div style="
      margin-top: 32px;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(201, 168, 76, 0.2);
      border-top-color: #C9A84C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    "></div>
  </div>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.3s';
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
</body>
</html>
